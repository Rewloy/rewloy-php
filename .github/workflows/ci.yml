# Every push and pull request: check composer.json, install, then PHPStan and
# PHPUnit, on PHP 8.2, 8.3 and 8.4. The tests need no network: the API is a
# stub, and the curl transport talks to PHP's built-in server on 127.0.0.1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      # --no-plugins: no dependency runs code at install time.
      - run: composer install --no-interaction --no-progress --prefer-dist --no-plugins
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/phpunit
